# ─────────────────────────────────────────────────────────────
# arbitr-ai — Harness Environment: PROD
# ─────────────────────────────────────────────────────────────
environment:
  identifier: prod
  name: Production
  orgIdentifier: default
  projectIdentifier: arbitr_ai_platform
  description: Production environment for arbitr-ai
  variables:
    - name: ENVIRONMENT
      type: String
      value: prod
    - name: DEBUG
      type: String
      value: "false"
    - name: LOG_LEVEL
      type: String
      value: WARNING
    - name: DATABASE_URL
      type: Secret
      value: arbitr_ai_db_url_prod
    - name: REDIS_URL
      type: Secret
      value: arbitr_ai_redis_url_prod
    - name: OPENAI_API_KEY
      type: Secret
      value: arbitr_ai_openai_key_prod
    - name: FNS_API_KEY
      type: Secret
      value: arbitr_ai_fns_key_prod
    - name: ROSREESTR_API_KEY
      type: Secret
      value: arbitr_ai_rosreestr_key_prod
    - name: FSSP_API_KEY
      type: Secret
      value: arbitr_ai_fssp_key_prod
    - name: POST_API_TOKEN
      type: Secret
      value: arbitr_ai_post_token_prod
    - name: SECRET_KEY
      type: Secret
      value: arbitr_ai_jwt_secret_prod
    - name: CRYPTOPRO_LICENSE
      type: Secret
      value: arbitr_ai_cryptopro_license
    - name: SMTP_PASSWORD
      type: Secret
      value: arbitr_ai_smtp_password_prod