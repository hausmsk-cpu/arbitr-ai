# Политика сетевой безопасности: только HTTPS-трафик в backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arbitr-ai-backend-policy
  namespace: arbitr-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: arbitr-ai
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app: arbitr-ai
      ports:
        - protocol: TCP
          port: 5432   # PostgreSQL
        - protocol: TCP
          port: 6379   # Redis